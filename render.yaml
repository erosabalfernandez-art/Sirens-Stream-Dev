services:
    - type: web
      name: eclipse-angels-dev-web
      runtime: static
      buildCommand: npx --yes pnpm@9 install && NODE_ENV=production BASE_PATH=/ npx --yes pnpm@9 --filter @workspace/sirens-stream run build
      staticPublishPath: artifacts/sirens-stream/dist
      pullRequestPreviewsEnabled: false
      envVars:
        - key: VITE_API_URL
          value: https://eclipse-angels-dev-api.onrender.com
        - key: VITE_SUPABASE_URL
          value: https://eyeklnjwbyvsgirsglbx.supabase.co
        - key: VITE_SUPABASE_ANON_KEY
          sync: false
        - key: VITE_GROQ_API_KEY
          sync: false
        - key: VITE_VAPID_PUBLIC_KEY
          value: BJVSReXGLMUliG8Gue6XOpiQ4ucAZ4PS9eICjnoGhA9nJGJTdVJqZ2MAyBUmkfKsuAKUWA0Qa4EtpkhBBOgkH5E
      routes:
        - type: rewrite
          source: /*
          destination: /index.html

    - type: web
      name: eclipse-angels-dev-api
      runtime: node
      buildCommand: npx --yes pnpm@9 install && npx --yes pnpm@9 --filter @workspace/api-server run build
      startCommand: npx --yes pnpm@9 --filter @workspace/api-server run start
      pullRequestPreviewsEnabled: false
      envVars:
        - key: NODE_ENV
          value: production
        - key: PORT
          value: "10000"
        - key: SUPABASE_URL
          value: https://eyeklnjwbyvsgirsglbx.supabase.co
        - key: VAPID_PUBLIC_KEY
          value: BJVSReXGLMUliG8Gue6XOpiQ4ucAZ4PS9eICjnoGhA9nJGJTdVJqZ2MAyBUmkfKsuAKUWA0Qa4EtpkhBBOgkH5E
        - key: VAPID_PRIVATE_KEY
          value: 4rZgBMcodSQnOTRlnOH1CpvS815bubQFQG_VGo_Rgds
        - key: VAPID_SUBJECT
          value: mailto:eclipse_angels@outlook.com
        - key: GROQ_API_KEY
          sync: false
        - key: SUPABASE_SERVICE_ROLE_KEY
          sync: false
